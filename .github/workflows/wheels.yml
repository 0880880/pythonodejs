name: Build wheels

on:
  push:
    branches: [ main, rewrite-cpython ]
  pull_request:

env:
  NODE_VERSION: "20.19.5"  # change if you want another Node version

jobs:
  build-manylinux:
    name: Build Linux wheels (manylinux via cibuildwheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install minimal host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev curl pkg-config autoconf libtool automake
      - name: Build wheels with cibuildwheel (manylinux container will run build hook)
        env:
          CIBW_ENVIRONMENT_LINUX: "CARES_USE_DEV_URANDOM=1"
          CIBW_PLATFORM: "linux"
          CIBW_BEFORE_BUILD: "bash scripts/build_node.sh linux && ls -R /project/libs/libnode && ls -R /project/include"
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          # CIBW_MANYLINUX_X86_64_IMAGE: "manylinux2014"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
        uses: pypa/cibuildwheel@v3.0.0
        with:
          output-dir: wheelhouse
      - name: Upload wheels (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: wheelhouse/*.whl

  build-macos:
    name: Build macOS wheels
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Homebrew deps
        run: |
          # ensure build-essential equivalents and curl
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || true
          brew update || true
          brew install python3 cmake pkg-config || true
      - name: Build libnode (macOS host)
        run: |
          bash scripts/build_node.sh macos
      - name: Build wheels with cibuildwheel (macOS)
        env:
          CIBW_PLATFORM: "macos"
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
        uses: pypa/cibuildwheel@v3.0.0
        with:
          output-dir: wheelhouse
      - name: Upload wheels (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: wheelhouse/*.whl


  build-windows:
    name: Build Windows wheels
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          choco install -y python visualstudio2022buildtools curl nasm
          choco install -y visualstudio2022-workload-nodebuildtools
      - name: Build libnode (Windows host - MSVC)
        run: |
          bash -lc "bash scripts/build_node.sh windows"
      - name: Build wheels with cibuildwheel (Windows)
        env:
          CIBW_PLATFORM: "windows"
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
        uses: pypa/cibuildwheel@v3.0.0
        with:
          output-dir: wheelhouse
      - name: Upload wheels (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: wheelhouse/*.whl

