name: Build wheels

on:
  push:
    branches: [ main, rewrite-cpython ]
  pull_request:

jobs:
  build-manylinux:
    name: Build NodeJS Linux
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-v2
          restore-keys: |
            ${{ runner.os }}-ccache-
      - name: Install deps & Setup
        run: |
          dnf update -y
          dnf install -y epel-release
          dnf install -y gcc gcc-c++ make python3-devel curl pkg-config autoconf libtool automake \
                    ccache gawk m4 texinfo bison python3 wget xz gdb sed kernel-headers llvm-toolset ninja-build cmake
          # Install Mold from prebuilt binary
          set -eux
          curl -LO https://github.com/rui314/mold/releases/download/v2.40.4/mold-2.40.4-x86_64-linux.tar.gz
          tar -xzf mold-2.40.4-x86_64-linux.tar.gz
          mv mold-2.40.4-x86_64-linux /usr/local/mold
          ln -s /usr/local/mold/bin/mold /usr/local/bin/mold
          ln -s /usr/local/mold/bin/mold /usr/local/bin/ld.mold

          if command -v mold >/dev/null 2>&1; then
              export LDFLAGS="-fuse-ld=mold"
              export LD=mold
          fi

          mold --version
          clang --version
          cmake --version
          ninja --version
      - name: Build libnode
        run: |
          export CC_host="ccache clang"
          export CXX_host="ccache clang++"
          export CC="ccache clang"
          export CXX="ccache clang++"
          export LDFLAGS_host="-fuse-ld=mold"
          export LDFLAGS="-fuse-ld=mold"
          cd include/node
          ./configure --shared --ninja
          make -j$(nproc)
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libnode-linux
          path: include/node/out/Release/lib/libnode.so.*

  build-macos:
    name: Build NodeJS macOS
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: macos-13  # Intel runner
            configure_flags: --ninja --shared
            deployment_target: "10.15"
          - arch: arm64
            os: macos-14  # Apple Silicon runner
            configure_flags: --ninja --shared
            deployment_target: "11.0" 
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ matrix.os }}-${{ matrix.arch }}-ccache-${{ github.sha }}-v2
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.arch }}-ccache-
      - name: Install Homebrew deps
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || true  
          brew install cmake ninja || true
          curl -L https://github.com/ccache/ccache/releases/download/v4.12.1/ccache-4.12.1-darwin.tar.gz | tar xz
          sudo cp ccache-4.12.1-darwin/ccache /usr/local/bin/
          ccache --version
      - name: Build libnode
        run: |
          # export MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}
          export CC="ccache clang"
          export CXX="ccache clang++"
          cd include/node
          ./configure ${{ matrix.configure_flags }}
          make
      - name: Create archive
        run: |
          cd include/node/out/Release
          tar -cJf "libnode-macos.tar.xz" libnode.*
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libnode-macos-${{ matrix.arch }}
          path: include/node/out/Release/*.tar.xz


  build-windows:
    name: Build NodeJS Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: $HOME/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-v2
          restore-keys: |
            ${{ runner.os }}-ccache-
      - name: Install build tools
        shell: pwsh
        run: |
          choco install -y python visualstudio2022buildtools curl nasm 7zip
          choco install -y visualstudio2022-workload-vctools --package-parameters "--add Microsoft.VisualStudio.Component.VC.Llvm.Clang --add Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset"
          choco install -y visualstudio2022-workload-nodebuildtools
          $progressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri https://aka.ms/getwinget -OutFile Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle
          Add-AppxPackage Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle
          winget configure ./include/node/.configurations/configuration.dsc.yaml --accept-configuration-agreements --disable-interactivity
          Invoke-WebRequest -Uri https://github.com/ccache/ccache/releases/download/v4.12.1/ccache-4.12.1-windows-x86_64.zip -OutFile $Env:RUNNER_TEMP\ccache.zip
          Expand-Archive -Path $Env:RUNNER_TEMP\ccache.zip -DestinationPath include\node -Force
          $ccachedir = Get-ChildItem -Directory include\node\ccache* | Select-Object -First 1

          Copy-Item "$($ccachedir.FullName)\ccache.exe" -Destination include\node\cl.exe
      - name: Build libnode (Windows host - MSVC)
        run: |
          cd include\node
          .\vcbuild.bat x64 dll openssl-no-asm clang-cl ccache include\node\cl.exe
      - name: Create archive
        run: |
          cd include\node\out\Release
          Remove-Item -Path "*.pdb" -ErrorAction SilentlyContinue
          7z a -mx9 "libnode-windows.zip" libnode.dll libnode.lib
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libnode-windows
          path: include/node/out/Release/*.zip

  build-wheels-linux:
    name: Build wheels on Linux
    needs: build-manylinux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Download libnode artifact
        uses: actions/download-artifact@v4
        with:
          name: libnode-linux
          path: ./libnode-dist
      
      - name: Extract libnode
        run: |
          mkdir -p libs/linux
          cp libnode-dist/libnode.so.* libs/linux/
          ls -la libs/linux/
      
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: |
            cp {package}/libs/linux/libnode.so.* /usr/local/lib/
            cd /usr/local/lib/
            for f in libnode.so.*; do
              ln -sf "$f" libnode.so
              break
            done
            ldconfig
            ls -la | grep -i "node"
          CIBW_ENVIRONMENT_LINUX: |
            LIBNODE_PATH=/usr/local/lib
            LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: |
            auditwheel repair -w {dest_dir} {wheel} --lib-sdir .
      
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: ./wheelhouse/*.whl

  build-wheels-macos:
    name: Build wheels on macOS
    needs: build-macos
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: macos-13
            cibw_arch: x86_64
          - arch: arm64
            os: macos-14
            cibw_arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Download libnode artifact
        uses: actions/download-artifact@v4
        with:
          name: libnode-macos-${{ matrix.arch }}
          path: ./libnode-dist
      
      - name: Extract libnode
        run: |
          cd libnode-dist
          tar -xJf libnode-macos.tar.xz
          mkdir -p ../libs/macos
          VERSIONED_LIB=$(ls libnode.*.dylib | head -n 1)
          cp "$VERSIONED_LIB" ../libs/macos/
          cd ../libs/macos
          ln -sf "$VERSIONED_LIB" libnode.dylib
          ls -la
          # Verify architecture
          file libnode.dylib
          lipo -info libnode.dylib
      
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          MACOSX_DEPLOYMENT_TARGET: 10.15
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
          CIBW_ARCHS_MACOS: ${{ matrix.cibw_arch }}
          CIBW_BEFORE_ALL_MACOS: |
            mkdir -p $HOME/lib
            cp -r {package}/libs/macos/* $HOME/lib/
            
          CIBW_ENVIRONMENT_MACOS: |
            LIBNODE_PATH=$HOME/lib
            DYLD_LIBRARY_PATH=$HOME/lib:$DYLD_LIBRARY_PATH
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: |
            delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
      
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: ./wheelhouse/*.whl

  build-wheels-windows:
    name: Build wheels on Windows
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Download libnode artifact
        uses: actions/download-artifact@v4
        with:
          name: libnode-windows
          path: ./libnode-dist
      
      - name: Extract libnode
        shell: pwsh
        run: |
          cd libnode-dist
          7z x libnode-windows.zip
          New-Item -ItemType Directory -Force -Path ..\libs\windows
          Copy-Item libnode.* ..\libs\windows\
          Get-ChildItem ..\libs\windows\
      
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
          CIBW_BEFORE_ALL_WINDOWS: |
            xcopy /Y /I {package}\libs\windows\* C:\libnode\
          CIBW_SKIP: "*-win32"
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ENVIRONMENT_WINDOWS: |
            LIBNODE_PATH=C:\libnode
            PATH=C:\libnode;%PATH%
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: |
            delvewheel repair -w {dest_dir} {wheel} --add-path C:\libnode
      
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: ./wheelhouse/*.whl

