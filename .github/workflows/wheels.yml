name: Build wheels

on:
  push:
    branches: [ main, rewrite-cpython ]
  pull_request:

jobs:
  build-manylinux:
    name: Build Linux wheels (manylinux via cibuildwheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-v2
          restore-keys: |
            ${{ runner.os }}-ccache-
      - name: Install deps & Setup
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev curl pkg-config autoconf libtool automake \
                    ccache mold ninja-build clang-21 \
                    gcc g++ make gawk m4 texinfo bison \
                    python3 wget xz-utils gdb sed 
          sudo apt install linux-headers-$(uname -r)
          export LDFLAGS="-fuse-ld=mold"
          export LD=/usr/bin/mold
      - name: Build GLIBC 2.28
        run: |
          export CC="gcc"
          export CXX="g++"
          export CFLAGS="-O2 -fcf-protection=none"
          cd /tmp
          wget https://ftp.gnu.org/gnu/libc/glibc-2.28.tar.xz
          tar -xf glibc-2.28.tar.xz
          cd glibc-2.28
          mkdir build && cd build
          ../configure --prefix=/opt/glibc-2.28 --disable-werror
          make -j$(nproc)

      - name: Build libnode
        run: |
          export CC_host="ccache clang"
          export CXX_host="ccache clang++"
          export CC="ccache clang --sysroot=/opt/glibc-2.28"
          export CXX="ccache clang++ --sysroot=/opt/glibc-2.28"
          export LDFLAGS_host="-fuse-ld=mold"
          export LDFLAGS="-fuse-ld=mold -L/opt/glibc-2.28/lib -Wl,-rpath=/opt/glibc-2.28/lib -Wl,--dynamic-linker=/opt/glibc-2.28/lib/ld-linux-x86-64.so.2"
          export LD_LIBRARY_PATH=/opt/glibc-2.28/lib

          cd include/node
          ./configure --shared --cross-compiling
          make -j$(nproc)
      - name: Create archive
        run: |
          cd include/node/out/Release
          ln -s $(ls -v libnode.so.* | tail -n 1) libnode.so
          tar -cJf "libnode-linux.tar.xz" libnode.*
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libnode-linux
          path: include/node/out/Release/*.tar.xz

  build-macos:
    name: Build macOS wheels
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Homebrew deps
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || true
          brew update || true
          brew install cmake ccache || true
      - name: Build libnode
        run: |
          cd include/node
          ./configure --ninja --shared
          make
      - name: Create archive
        run: |
          cd include/node/out/Release
          ln -s $(ls -v libnode.* | tail -n 1) libnode.dylib
          tar -cJf "libnode-macos.tar.xz" libnode.*
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libnode-macos
          path: include/node/out/Release/*.tar.xz


  build-windows:
    name: Build Windows wheels
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        shell: pwsh
        run: |
          choco install -y python visualstudio2022buildtools curl nasm 7zip
          choco install -y visualstudio2022-workload-nodebuildtools
          $progressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri https://aka.ms/getwinget -OutFile Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle
          Add-AppxPackage Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle
          winget configure ./include/node/.configurations/configuration.dsc.yaml --accept-configuration-agreements --disable-interactivity
      - name: Build libnode (Windows host - MSVC)
        run: |
          cd include\node
          .\vcbuild.bat x64 dll openssl-no-asm
      - name: Create archive
        run: |
          cd include\node\out\Release
          Remove-Item -Path "*.pdb" -ErrorAction SilentlyContinue
          7z a -mx9 "libnode-windows.zip" libnode.*
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libnode-windows
          path: include/node/out/Release/*.zip

  build-wheels-linux:
    name: Build wheels on Linux
    needs: build-manylinux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Download libnode artifact
        uses: actions/download-artifact@v4
        with:
          name: libnode-linux
          path: ./libnode-dist
      
      - name: Extract libnode
        run: |
          cd libnode-dist
          tar -xJf libnode-linux.tar.xz
          mkdir -p ../libs/linux
          cp libnode.* ../libs/linux/
          ls -la ../libs/linux/
      
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: |
            dnf install -y libatomic
            cp -r {package}/libs/linux/* /usr/local/lib/
            ldconfig
          CIBW_ENVIRONMENT_LINUX: |
            LIBNODE_PATH=/usr/local/lib
            LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: |
            auditwheel repair -w {dest_dir} {wheel} --lib-sdir .
      
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: ./wheelhouse/*.whl

  build-wheels-macos:
    name: Build wheels on macOS
    needs: build-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Download libnode artifact
        uses: actions/download-artifact@v4
        with:
          name: libnode-macos
          path: ./libnode-dist
      
      - name: Extract libnode
        run: |
          cd libnode-dist
          tar -xJf libnode-macos.tar.xz
          mkdir -p ../libs/macos
          cp libnode.* ../libs/macos/
          ls -la ../libs/macos/
      
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
          CIBW_ARCHS_MACOS: x86_64 arm64
          CIBW_BEFORE_ALL_MACOS: |
            mkdir -p $HOME/lib
            cp -r {package}/libs/macos/* $HOME/lib/
          CIBW_ENVIRONMENT_MACOS: |
            LIBNODE_PATH=$HOME/lib
            DYLD_LIBRARY_PATH=$HOME/lib:$DYLD_LIBRARY_PATH
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: |
            delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
      
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: ./wheelhouse/*.whl

  build-wheels-windows:
    name: Build wheels on Windows
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Download libnode artifact
        uses: actions/download-artifact@v4
        with:
          name: libnode-windows
          path: ./libnode-dist
      
      - name: Extract libnode
        shell: pwsh
        run: |
          cd libnode-dist
          7z x libnode-windows.zip
          New-Item -ItemType Directory -Force -Path ..\libs\windows
          Copy-Item libnode.* ..\libs\windows\
          Get-ChildItem ..\libs\windows\
      
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
          CIBW_BEFORE_ALL_WINDOWS: |
            xcopy /Y /I {package}\libs\windows\* C:\libnode\
          CIBW_ENVIRONMENT_WINDOWS: |
            LIBNODE_PATH=C:\libnode
            PATH=C:\libnode;%PATH%
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: |
            delvewheel repair -w {dest_dir} {wheel} --add-path C:\libnode
      
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: ./wheelhouse/*.whl

