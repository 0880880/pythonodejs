name: Build wheels

on:
  push:
    branches: [ main, rewrite-cpython ]
  pull_request:

jobs:
  build-manylinux:
    name: Build NodeJS Linux
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-v2
          restore-keys: |
            ${{ runner.os }}-ccache-
      - name: Install deps & Setup
        run: |
          dnf update -y
          dnf install -y epel-release
          dnf install -y gcc gcc-c++ make python3-devel curl pkg-config autoconf libtool automake \
                    ccache ninja-build gawk m4 texinfo bison python3 wget xz gdb sed kernel-headers cmake
          # Install Mold from prebuilt binary
          cd /tmp
          wget https://github.com/rui314/mold/releases/download/v2.40.0/mold-2.40.0-x86_64-linux.tar.gz
          tar -xzf mold-2.40.0-x86_64-linux.tar.gz
          cp mold-2.40.0-x86_64-linux/bin/mold /usr/local/bin/mold
          set -euxo pipefail

          LLVM_VERSION=21.1.0
          CMAKE_VERSION=3.30.5
          NINJA_VERSION=1.12.1

          INSTALL_BASE=/usr/local
          LLVM_DIR=${INSTALL_BASE}/clang-${LLVM_VERSION}
          CMAKE_DIR=${INSTALL_BASE}/cmake-${CMAKE_VERSION}
          NINJA_DIR=${INSTALL_BASE}/ninja-${NINJA_VERSION}

          mkdir -p "${INSTALL_BASE}"

          cd /tmp
          curl -sSL -O "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          tar -xJf "LLVM-${LLVM_VERSION}-Linux-X64.tar.xz" -C "${INSTALL_BASE}"
          mv "${INSTALL_BASE}/LLVM-${LLVM_VERSION}-Linux-X64" "${LLVM_DIR}"

          curl -sSL -O "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          tar -xzf "cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" -C "${INSTALL_BASE}"
          mv "${INSTALL_BASE}/cmake-${CMAKE_VERSION}-linux-x86_64" "${CMAKE_DIR}"

          curl -sSL -O "https://github.com/ninja-build/ninja/releases/download/v${NINJA_VERSION}/ninja-linux.zip"
          mkdir -p "${NINJA_DIR}/bin"
          unzip -q "ninja-linux.zip" -d "${NINJA_DIR}/bin"
          chmod +x "${NINJA_DIR}/bin/ninja"

          export PATH="${LLVM_DIR}/bin:${CMAKE_DIR}/bin:${NINJA_DIR}/bin:${PATH}"
          export CC=clang
          export CXX=clang++

          if command -v mold >/dev/null 2>&1; then
              export LDFLAGS="-fuse-ld=mold"
              export LD=mold
          fi

          clang --version
          cmake --version
          ninja --version
      - name: Build libnode
        run: |
          export CC_host="ccache clang"
          export CXX_host="ccache clang++"
          export CC="ccache clang"
          export CXX="ccache clang++"
          export LDFLAGS_host="-fuse-ld=mold"
          export LDFLAGS="-fuse-ld=mold"
          cd include/node
          ./configure --shared --ninja
          make -j$(nproc)
      - name: Create archive
        run: |
          cd include/node/out/Release
          ln -s $(ls -v libnode.so.* | tail -n 1) libnode.so
          tar -cJf "libnode-linux.tar.xz" libnode.*
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libnode-linux
          path: include/node/out/Release/*.tar.xz

  build-macos:
    name: Build NodeJS macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Homebrew deps
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || true
          brew update || true
          brew install cmake ccache || true
      - name: Build libnode
        run: |
          cd include/node
          ./configure --ninja --shared
          make
      - name: Create archive
        run: |
          cd include/node/out/Release
          tar -cJf "libnode-macos.tar.xz" libnode.*
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libnode-macos
          path: include/node/out/Release/*.tar.xz


  build-windows:
    name: Build NodeJS Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        shell: pwsh
        run: |
          choco install -y python visualstudio2022buildtools curl nasm 7zip
          choco install -y visualstudio2022-workload-nodebuildtools
          $progressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri https://aka.ms/getwinget -OutFile Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle
          Add-AppxPackage Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle
          winget configure ./include/node/.configurations/configuration.dsc.yaml --accept-configuration-agreements --disable-interactivity
      - name: Build libnode (Windows host - MSVC)
        run: |
          cd include\node
          .\vcbuild.bat x64 dll openssl-no-asm
      - name: Create archive
        run: |
          cd include\node\out\Release
          Remove-Item -Path "*.pdb" -ErrorAction SilentlyContinue
          7z a -mx9 "libnode-windows.zip" libnode.*
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libnode-windows
          path: include/node/out/Release/*.zip

  build-wheels-linux:
    name: Build wheels on Linux
    needs: build-manylinux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Download libnode artifact
        uses: actions/download-artifact@v4
        with:
          name: libnode-linux
          path: ./libnode-dist
      
      - name: Extract libnode
        run: |
          cd libnode-dist
          tar -xJf libnode-linux.tar.xz
          mkdir -p ../libs/linux
          cp -P libnode.* ../libs/linux/
          ls -la ../libs/linux/
      
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: |
            dnf install -y libatomic
            cp -r {package}/libs/linux/* /usr/local/lib/
            ldconfig
          CIBW_ENVIRONMENT_LINUX: |
            LIBNODE_PATH=/usr/local/lib
            LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: |
            auditwheel repair -w {dest_dir} {wheel} --lib-sdir .
      
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: ./wheelhouse/*.whl

  build-wheels-macos:
    name: Build wheels on macOS
    needs: build-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Download libnode artifact
        uses: actions/download-artifact@v4
        with:
          name: libnode-macos
          path: ./libnode-dist
      
      - name: Extract libnode
        run: |
          cd libnode-dist
          tar -xJf libnode-macos.tar.xz
          ln -s $(ls -v libnode.* | tail -n 1) libnode.dylib
          mkdir -p ../libs/macos
          cp -P libnode.* ../libs/macos/
          ls -la ../libs/macos/
      
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          MACOSX_DEPLOYMENT_TARGET: 10.15
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
          CIBW_ARCHS_MACOS: x86_64 arm64
          CIBW_BEFORE_ALL_MACOS: |
            mkdir -p $HOME/lib
            cp -r {package}/libs/macos/* $HOME/lib/
          CIBW_ENVIRONMENT_MACOS: |
            LIBNODE_PATH=$HOME/lib
            DYLD_LIBRARY_PATH=$HOME/lib:$DYLD_LIBRARY_PATH
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: |
            delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
      
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: ./wheelhouse/*.whl

  build-wheels-windows:
    name: Build wheels on Windows
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Download libnode artifact
        uses: actions/download-artifact@v4
        with:
          name: libnode-windows
          path: ./libnode-dist
      
      - name: Extract libnode
        shell: pwsh
        run: |
          cd libnode-dist
          7z x libnode-windows.zip
          New-Item -ItemType Directory -Force -Path ..\libs\windows
          Copy-Item libnode.* ..\libs\windows\
          Get-ChildItem ..\libs\windows\
      
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
          CIBW_BEFORE_ALL_WINDOWS: |
            xcopy /Y /I {package}\libs\windows\* C:\libnode\
          CIBW_ENVIRONMENT_WINDOWS: |
            LIBNODE_PATH=C:\libnode
            PATH=C:\libnode;%PATH%
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: |
            delvewheel repair -w {dest_dir} {wheel} --add-path C:\libnode
      
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: ./wheelhouse/*.whl

